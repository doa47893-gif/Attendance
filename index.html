<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Attendance System</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family: Arial, sans-serif;
  background:#111;
  color:white;
  text-align:center;
  padding:20px;
}
button{
  padding:10px 20px;
  margin:10px;
  border:none;
  background:#00e5a0;
  font-weight:bold;
  cursor:pointer;
}
select,input{
  padding:8px;
  margin:5px;
}
#reader{
  width:300px;
  margin:20px auto;
}
table{
  width:100%;
  margin-top:30px;
  border-collapse:collapse;
}
td,th{
  border:1px solid #444;
  padding:8px;
}
</style>
</head>

<body>

<h2>QR Attendance System</h2>

<select id="sessionSelect">
  <option value="">Select Session</option>
  <option value="Morning_1">Morning Session</option>
  <option value="Evening_1">Evening Session</option>
</select>

<input type="date" id="filterDate">

<br>

<button onclick="toggleScanner()">Start / Stop Scanner</button>
<button onclick="downloadByDate()">Download Selected Date</button>

<div id="reader"></div>

<h3 id="lastScan">Last Scan: -</h3>

<h3>Attendance Records</h3>

<table>
<thead>
<tr>
<th>Name</th>
<th>ID</th>
<th>Session</th>
<th>Date</th>
<th>Time</th>
</tr>
</thead>
<tbody id="recordsTable"></tbody>
</table>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec";

let html5QrCode;
let scanning = false;
let cooldown = false;
let attendanceData = [];

function todayDate(){
  const d = new Date();
  return d.toISOString().split("T")[0];
}

document.getElementById("filterDate").value = todayDate();

async function fetchStudent(id){
  try{
    const res = await fetch(`${SCRIPT_URL}?id=${id}`);
    if(!res.ok) return null;
    return await res.json();
  }catch{
    return null;
  }
}

async function sendAttendance(record){
  await fetch(SCRIPT_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify(record)
  });
}

async function markAttendance(studentId){

  const session = document.getElementById("sessionSelect").value;
  if(!session){
    alert("Select session first");
    return;
  }

  const student = await fetchStudent(studentId);

  if(!student || !student.name){
    alert("Student not found in Google Sheet");
    return;
  }

  const now = new Date();
  const date = now.toISOString().split("T")[0];
  const time = now.toLocaleTimeString();

  const record = {
    studentId:studentId,
    studentName:student.name,
    session:session,
    date:date,
    time:time
  };

  attendanceData.push(record);
  await sendAttendance(record);

  document.getElementById("lastScan").innerText =
    "Last Scan: " + student.name;

  addRow(record);
}

function addRow(record){
  const row = `
    <tr>
      <td>${record.studentName}</td>
      <td>${record.studentId}</td>
      <td>${record.session}</td>
      <td>${record.date}</td>
      <td>${record.time}</td>
    </tr>
  `;
  document.getElementById("recordsTable").innerHTML += row;
}

async function toggleScanner(){

  const session = document.getElementById("sessionSelect").value;
  if(!session){
    alert("Select session first");
    return;
  }

  if(scanning){
    await html5QrCode.stop();
    scanning = false;
    return;
  }

  html5QrCode = new Html5Qrcode("reader");

  try{
    await html5QrCode.start(
      { facingMode:"environment" },
      { fps:10, qrbox:250 },
      (decodedText)=>{
        if(cooldown) return;
        cooldown = true;
        setTimeout(()=>cooldown=false,2000);
        markAttendance(decodedText.trim());
      }
    );
    scanning = true;
  }catch{
    alert("Camera permission denied or error");
  }
}

function downloadByDate(){

  const selectedDate = document.getElementById("filterDate").value;
  if(!selectedDate){
    alert("Select date first");
    return;
  }

  const filtered = attendanceData.filter(r => r.date === selectedDate);

  if(filtered.length === 0){
    alert("No records for selected date");
    return;
  }

  let csv = "Name,ID,Session,Date,Time\n";

  filtered.forEach(r=>{
    csv += `${r.studentName},
